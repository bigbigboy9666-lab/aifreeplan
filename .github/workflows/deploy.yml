name: Deploy to aifreeplan.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Generate sitemap
        run: pnpm run sitemap

      - name: Validate content quality
        run: pnpm run validate

      - name: Deploy to CF Pages
        uses: cloudflare/pages-action@v1
        with:
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: aifreeplan
          directory: dist
          branch: main
          apiToken: ${{ secrets.CF_PAGES_TOKEN }}

      - name: Trigger deploy notification
        if: success()
        run: |
          echo "aifreeplan.com: DEPLOY OK — 自动部署成功"
          curl -s -X POST "https://api.github.com/repos/bigbigboy9666-lab/aifreeplan/dispatches" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.DEPLOY_KEY }}" \
            -d '{"event_type": "deploy-success", "client_payload": {"tools": "99", "guides": "43"}}' || true
