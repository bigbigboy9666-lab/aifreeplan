name: Deploy to aifreeplan.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Build static site
        run: pnpm build

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Validate content quality
        run: node scripts/validate-content.mjs

      - name: Deploy to main branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "bot"
          git config user.email "bot@aifreeplan.com"

          # Copy dist to root
          cp -r dist/* .
          cp zh/index.html index.html 2>/dev/null || true
          cp _headers . 2>/dev/null || true
          cp _redirects . 2>/dev/null || true

          git add -A
          git commit -m "deploy: automatic build $(date +%Y-%m-%d-%H%M)" || echo "Nothing to commit"
          git push origin main --force
